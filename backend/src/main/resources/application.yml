spring:
  application:
    name: finance
  # O Spring Boot não carrega arquivos .env automaticamente. Este import torna
  # GEMINI_API_KEY disponível também na execução local; em produção a variável
  # de ambiente do processo continua tendo precedência.
  config:
    import: optional:file:./.env[.properties]
  datasource:
    # Ajustado: Adicionado &allowPublicKeyRetrieval=true
    url: jdbc:mysql://localhost:3306/finance_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
jwt:
  # Valor padrão SÓ para desenvolvimento local. Em produção, configurar
  # a variável de ambiente JWT_SECRET com um valor forte e único.
  secret: ${JWT_SECRET:Y2hhdmVfc2VjcmV0YV9tdWl0b19ncmFuZGVfcGFyYV9vX2hhY2thdGhvbl9zZWd1cmFuY2E=}
  expiration: ${JWT_EXPIRATION:86400000} # 24 horas
# Configuração do microserviço Python (Data Science / FastAPI).
# URL e token via variável de ambiente — nunca hardcoded.
# Valores padrão abaixo servem só para desenvolvimento local.
datascience:
  api:
    url: ${DATASCIENCE_API_URL:http://localhost:8000}
    token: ${DATASCIENCE_API_TOKEN:token-nao-configurado}
    connect-timeout-ms: 5000
    read-timeout-ms: 10000
fai:
  gemini:
    # Configure GEMINI_API_KEY no ambiente. Nunca inclua a chave em código ou respostas HTTP.
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
    connect-timeout-ms: ${GEMINI_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${GEMINI_READ_TIMEOUT_MS:15000}
---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    # Ajustado: Adicionado &allowPublicKeyRetrieval=true para quando rodar dentro do container
    url: jdbc:mysql://mysql:3306/finance_db?useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
